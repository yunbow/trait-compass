# =============================================================================
# 【架空のサンプルデータ】ローカル環境構築の動作確認用フィクスチャ
#
# このファイルは、公開リポジトリでローカルセットアップ手順(docs/usage/local-setup.md)の
# 動作確認を行うための架空サンプルである。学校名・施設名・住所・電話番号・URL・出典等の
# 内容はすべて創作であり、実在の学校・窓口・データとは一切関係ない。実データとして
# 扱ってはならない。
#
# 唯一の例外として municipalityCode / municipalityName(13106 / 台東区)のみ実在の値を
# 使用している。アプリの区市町村選択(municipality picker)が実在62自治体の正本レジストリ
# (app/src/features/support/constants/municipality-codes.ts)でコードを解決するため、
# 架空コードでは画面上で確認できないという理由による。
#
# 実運用の区市町村別調査データは data/manual/municipalities/*.yaml(非公開)にあり、
# 同じコマンドパターンで投入する。
#
# licenseAudit は投入ゲート(ingest-manual-survey.mjs)を通過できるよう、投入可能な
# ステータス(ccby_replaced / not_applicable)を設定している。ライセンス表記も架空である。
# =============================================================================

