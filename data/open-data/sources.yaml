  sourceOrg: 国立障害者リハビリテーションセンター
  url: https://www.rehab.go.jp/ddis/understand
  format: HTML
  granularity: article
  updateFrequency: irregular
  license: pdl-1.0
  license_confirmed_at: 2026-07-13
  license_evidence_url: http://www.rehab.go.jp/agree
  ingest_target: facilities
  fetch: direct
  files:
    - url: https://www.rehab.go.jp/ddis/understand/whatsdd
      filename: whatsdd.html
