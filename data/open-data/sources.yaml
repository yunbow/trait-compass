# data/open-data/ に置く原本データの出典マニフェスト。
#
# 2026-07-13時点の調査(WebSearch/WebFetchによる確認)で実在を確認したもののみ記載する。
# 実在未確認のURLを推測で追加しないこと(workers/ingest/datasets.config.ts と同じ運用ルール)。
#
# already_wired_in_ingest_worker: true の場合、workers/ingest/datasets.config.ts の
# INGEST_DATASETS で既に自動取込対象になっている。ここでの再取得は不要
# (二重実装を避けるため、対応する id をコメントで参照する)。

- id: tokyo-public-school-list
  dataset_id: ds-tokyo-public-school-list
  ckan_package_id: t000021d2000000191
  title: 公立学校統計調査報告書【東京都公立学校一覧】(CSV)
  sourceOrg: 東京都教育委員会
  url: https://catalog.data.metro.tokyo.lg.jp/dataset/t000021d2000000191
  format: CSV
  granularity: school
  updateFrequency: yearly
  license: cc-by-4.0
  license_confirmed_at: 2026-08-18
  license_evidence_url: https://catalog.data.metro.tokyo.lg.jp/api/3/action/package_show?id=t000021d2000000191
  ingest_target: none
  fetch: direct
  files:
    - url: https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/r7_shougakkou_ichiran
      filename: r7_shougakkou_ichiran.csv
    - url: https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/r7_ichiran_01
      filename: r7_ichiran_01.csv
    - url: https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/r7_koutougakkou_address
      filename: r7_koutougakkou_address.csv
    - url: https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/r7_tokubetsushien_ichiran_address
      filename: r7_tokubetsushien_ichiran_address.csv
  already_wired_in_ingest_worker: false
  note: >-
    学校名・所在地・電話番号の基礎データ。都立高校(チャレンジ/エンカレッジスクール含む)・
    都立特別支援学校の学校名・住所・電話番号を含む(通学区域[どの住所がどの特別支援学校の
    対象か]そのものは含まない。そちらは引き続き tokyo-special-needs-school-search 参照)。
    2026-07-20時点ではkyoiku.metro.tokyo.lg.jp自体の著作権ページ
    (administration/web/rights.html、全著作権留保)のみを根拠にlicense: noneと判定していたが、
    2026-08-18の再調査で同一データ(r7_ichiran_01等)が東京都オープンデータカタログ
    (catalog.data.metro.tokyo.lg.jp、package id: t000021d2000000191)にも東京都教育庁により
    正式登録されており、CKAN package_show APIでlicense_id: CC-BY-4.0と明記されていることを
    確認した。都庁データの許諾申請メール文面が言及する「公表」(サイトへの単純掲載)と「公開」
    (オープンデータカタログへの正式登録)の違いに該当し、後者を優先してlicense: cc-by-4.0に
    訂正。ingest_targetはschool_registryへ投入するnormalize関数が未実装のためnoneのまま
    (ライセンス判定は解消済み、パース実装は別タスク)。

