    「発達障害を理解する」(/ddis/understand/)配下の全3ページ(2026-07-20時点でサイトマップ確認済み、
    これが全量)。隣接カテゴリ(/ddis/aware、/ddis/howto)には20件超の追加候補ページがあるが、
    今回はスコープ外(follow-up候補)。dataset_id は workers/ingest/datasets.config.ts の
    ds-hattatsu-shien-center と共有する(datasets メタ行はworkflow.ts側も更新しうるが、
    facilities実データはこちら(scripts/data/)からのみ投入する)。

